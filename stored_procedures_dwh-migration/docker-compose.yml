services: # what you want docker to do, add as many services as you need.
  postgres:
    image: postgres:15-alpine # Lightweight image to save disk space!
    container_name: prepal_postgres # 4. Container Identifier
    environment: # Mandatory parameter
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports: # 6. From where are we spinning up this local database?
      - "${DB_PORT}:5432"
    volumes: # Where the data will be stored? Hint: Local Storage Mount
      - postgres_data:/var/lib/postgresql/data
    
  pgadmin:
    image: dpage/pgadmin4
    container_name: prepal_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - postgres

  # Local, self-hosted secrets manager. Same integration pattern as Azure Key
  # Vault or AWS Secrets Manager from Airflow's point of view swapping to
  # one of those means swapping the backend class and its auth config fine for local demo use only.
  vault:
    image: hashicorp/vault:1.17
    container_name: prepal_vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  airflow:
    build: .
    container_name: prepal_airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false" # Hide Airflow's example DAGs, show only ours
      # No AIRFLOW_CONN_* env var here on purpose: the prepal_postgres_conn
      # connection now comes exclusively from Vault via the secrets backend
      # below, so a successful DAG run is proof Vault is actually the source.
      AIRFLOW__SECRETS__BACKEND: airflow.providers.hashicorp.secrets.vault.VaultBackend
      AIRFLOW__SECRETS__BACKEND_KWARGS: '{"url": "http://prepal_vault:8200", "token": "${VAULT_ROOT_TOKEN}", "mount_point": "secret", "connections_path": "connections"}'
      # dbt reads these same variables from profiles.yml via env_var()
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_HOST: prepal_postgres # Inside the Docker network, Postgres is not "localhost"
    ports:
      - "8085:8080" # 8080 is already taken by pgAdmin above
    volumes:
      - ../airflow:/opt/airflow/dags # This repo's DAG file
      - ../dbt:/opt/airflow/dbt      # Mounted so the DAG's dbt build task can reach it
    depends_on:
      - postgres
      - vault

volumes:
  postgres_data:
